<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f8f9ff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#111318"
      media="(prefers-color-scheme: dark)"
    />
    <title>Clock UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <nav>
      <ul>
        <li>
          <a href="#clock">
            <span class="material-icons" aria-hidden="true">schedule</span>
            <span>Clock</span>
          </a>
        </li>
        <li>
          <a href="#alarm">
            <span class="material-icons" aria-hidden="true">alarm</span>
            <span>Alarm</span>
          </a>
        </li>
        <li>
          <a href="#stopwatch">
            <span class="material-icons" aria-hidden="true">timer</span>
            <span>Stopwatch</span>
          </a>
        </li>
        <li>
          <a href="#timer">
            <span class="material-icons" aria-hidden="true"
              >hourglass_empty</span
            >
            <span>Timer</span>
          </a>
        </li>
      </ul>
    </nav>
    <main>
      <section id="clock">
        <x-clock>
          <time>00:00:00</time>
        </x-clock>
      </section>
      <section id="alarm">
        <x-alarm>
          <template>
            <section class="alarms">
              <input type="time" min="00:00" max="23:59" step="1" />
              <section class="controls">
                <button
                  class="start material-icons"
                  aria-label="Enable alarm"
                  title="Enable alarm"
                >
                  alarm_on
                </button>
                <button
                  class="pause material-icons"
                  aria-label="Disable alarm"
                  title="Disable alarm"
                >
                  alarm_off
                </button>
                <button
                  class="delete material-icons"
                  aria-label="Delete alarm"
                  title="Delete alarm"
                >
                  delete
                </button>
              </section>
            </section>
          </template>
          <section class="items"></section>
          <section class="controls">
            <button
              class="add material-icons"
              aria-label="Add alarm"
              title="Add alarm"
            >
              add_alarm
            </button>
          </section>
        </x-alarm>
      </section>
      <section id="stopwatch">
        <x-stopwatch>
          <time datetime="PT0S">00:00:00.00</time>
          <section class="controls">
            <button
              class="start material-icons"
              aria-label="Start"
              title="Start"
            >
              timer
            </button>
            <button
              class="pause material-icons"
              aria-label="Pause"
              title="Pause"
            >
              timer_off
            </button>
            <button
              class="restart material-icons"
              aria-label="Reset"
              title="Reset"
            >
              restart_alt
            </button>
          </section>
        </x-stopwatch>
      </section>
      <section id="timer">
        <x-timer>
          <time datetime="PT0S">00:00:00.00</time>
          <section class="items">
            <section class="timers">
              <input
                type="time"
                min="00:00:00"
                max="23:59:59"
                value="00:03:00"
                step="1"
              />
              <input
                type="time"
                min="00:00:00"
                max="23:59:59"
                value="00:01:00"
                step="1"
              />
            </section>
          </section>
          <section class="controls">
            <button
              class="start material-icons"
              aria-label="Start"
              title="Start"
            >
              timer
            </button>
            <button
              class="pause material-icons"
              aria-label="Pause"
              title="Pause"
            >
              timer_off
            </button>
            <button
              class="restart material-icons"
              aria-label="Reset"
              title="Reset"
            >
              restart_alt
            </button>
            <button
              class="loop material-icons"
              aria-label="Enable loop"
              title="Enable loop"
            >
              loop
            </button>
            <button
              class="no-loop material-icons"
              aria-label="Disable loop"
              title="Disable loop"
            >
              sync_disabled
            </button>
          </section>
        </x-timer>
      </section>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
